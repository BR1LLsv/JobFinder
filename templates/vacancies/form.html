{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>{{ title }}</h2>
    <form method="POST">
        {% csrf_token %}
        
        {% for field in form %}
            <p>
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span style="color: var(--danger-color); font-size: 13px;">{{ field.errors.0 }}</span>
                {% endif %}
            </p>
        {% endfor %}
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Зберегти</button>
            <a href="{% if form.instance.pk %}{% url 'vacancy_detail' form.instance.pk %}{% else %}{% url 'vacancy_list' %}{% endif %}" class="btn btn-secondary">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
